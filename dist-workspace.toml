[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
# A GitHub repo to push Homebrew formulas to
tap = "Nawy/brained"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Extra CI step to vendor ring's pinned nasm toolchain, which its build.rs
# requires on windows-msvc but doesn't search PATH for (see build-setup.yml).
github-build-setup = "../dist-includes/build-setup.yml"
# Allow manual edits to the generated CI file (we add a scoped GH_TOKEN override
# for the release-creation step; see .github/workflows/release.yml)
allow-dirty = ["ci"]

# System dependencies required to build (lancedb needs protoc)
[dist.dependencies.apt]
protobuf-compiler = "*"

[dist.dependencies.homebrew]
protobuf = "*"

[dist.dependencies.chocolatey]
protoc = "*"
