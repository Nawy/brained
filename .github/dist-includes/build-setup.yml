# ring hardcodes its nasm invocation as the relative path
# "./target/tools/windows/nasm/nasm", resolved against ring's OWN checkout
# directory (not ours), and never searches PATH (see BUILDING.md and
# mk/install-build-tools.ps1 in the ring repo). This only matters for
# windows-msvc targets that use nasm-based assembly (x86_64; aarch64 uses
# clang/.S files instead), so it's scoped to native Windows runners here.
# `cargo fetch` first makes cargo materialize ring's git checkout, then we
# glob for it, since its cache directory name is a hash of the git URL, not
# something we can hardcode, and vendor ring's own pinned nasm toolchain into
# the path it expects.
- name: Vendor ring's pinned nasm toolchain (ring hardcodes this path, doesn't search PATH)
  if: runner.os == 'Windows'
  shell: bash
  run: |
    cargo fetch --target x86_64-pc-windows-msvc
    for dir in "$HOME"/.cargo/git/checkouts/ring-*/*/; do
      [ -f "${dir}build.rs" ] || continue
      if ! [ -d "${dir}target/tools/windows/nasm" ]; then
        git clone --branch windows --depth 1 https://github.com/briansmith/ring-toolchain "${dir}target/tools/windows"
      fi
    done
