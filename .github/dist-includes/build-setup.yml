- name: Configure non-interactive apt (needed inside cross-compile containers)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"
    if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
    echo 'APT::Get::Assume-Yes "true";' | $SUDO tee /etc/apt/apt.conf.d/90assume-yes >/dev/null

# Cross-compile containers (e.g. messense/cargo-xwin for aarch64-pc-windows-msvc)
# set their default toolchain to a pinned version name (not the "stable"
# channel alias), and it lags behind the MSRV of our dependencies (e.g.
# lancedb). Since cargo is already present, dist's own rustup-install step is
# skipped, so `rustup default stable` both installs current stable and makes
# it the active default, overriding the container's pinned toolchain.
- name: Update pre-installed Rust toolchain (cross-compile containers only)
  if: matrix.container
  shell: bash
  run: rustup default stable

# ring's build.rs unconditionally forces the plain `clang` compiler (not
# clang-cl) on aarch64-pc-windows-msvc, because cc-rs classifies clang-cl as
# ToolFamily::Msvc rather than ToolFamily::Clang, so ring's `is_like_clang()`
# check never matches it and always overrides. cargo-xwin's default backend
# is clang-cl though, so it exports CRT/SDK include paths in clang-cl's
# slash-style syntax (/imsvc), which plain clang cannot parse. Forcing
# cargo-xwin onto the clang backend from the start makes it export the
# matching dash-style (-imsvc) flags instead, so they agree with the
# compiler ring is going to force anyway.
- name: Use cargo-xwin's clang backend (ring forces plain clang on aarch64-pc-windows-msvc)
  if: matrix.container
  shell: bash
  run: echo "XWIN_CROSS_COMPILER=clang" >> "$GITHUB_ENV"
