[package]
name = "brained-cli"
version = "0.1.8"
edition = "2024"
repository = "https://github.com/Nawy/brained.git"
authors = ["Ivan Ermolaev"]

[package.metadata.wix]
upgrade-guid = "581D7056-71A5-4421-A5B9-B94FCD4C6FD6"
path-guid = "C62A46AE-1912-44FA-887F-770570BD058F"
license = false
eula = false

[[bin]]
name = "brd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# esaxx_fast (C++) statically links MSVC's C++ runtime, conflicting with whisper-rs-sys; pure-Rust fallback is used instead.
tokenizers = { version = "0.23.1", default-features = false, features = ["progressbar", "onig"] }
hf-hub = { version = "1.0.0", features = ["blocking"] }
# ort-load-dynamic avoids a prebuilt ONNX Runtime static lib incompatible with this toolchain; requires the ONNX Runtime shared library at runtime.
# hf-hub-rustls-tls (not hf-hub-native-tls) avoids pulling openssl-sys, which fails to cross-compile for musl in CI.
fastembed = { version = "5.17.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-load-dynamic"] }
# Direct deps (not just transitive via fastembed) so ort_runtime.rs can download and load a matching ONNX Runtime build itself.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }
zip = "=2.4.2"
ureq = "=3.3.0"
# Linux/macOS ONNX Runtime archive is a gzipped tarball rather than zip.
tar = "0.4"
flate2 = "=1.1.9"
pdf-extract = "0.12.0"
undoc = "0.5.5"
# Audio transcription pipeline: symphonia decodes, rubato resamples to 16kHz mono, whisper-rs transcribes.
symphonia = { version = "=0.5.4", default-features = false, features = ["mp3", "isomp4", "aac"] }
rubato = "=0.15.0"
# Requires cmake, a C/C++ compiler, and libclang (bindgen) at build time; CPU-only, no GPU acceleration features.
whisper-rs = "=0.16.0"
once_cell = "1"
lancedb = "0.31.0"
# Must match the arrow version lancedb vendors; keep pinned in lockstep with lancedb.
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
rmcp-macros = "2.2.0"
serde_json = "1.0.151"
schemars = "1.2.1"
directories = "6.0.0"
# lancedb's build requires `protoc` on PATH (or PROTOC set).

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
ahash = "0.8.12"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
